server:
  port: 9090

spring:
  application:
    name: erp-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  config:
    import:
      - optional:nacos:erp-gateway.yml?refreshable=true
  cloud:
    nacos:
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yml
        refresh-enabled: true
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      enabled: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: erp-auth-login
          uri: lb://erp-auth
          predicates:
            - Path=/login
        - id: erp-auth-logout
          uri: lb://erp-auth
          predicates:
            - Path=/logout
        - id: erp-auth
          uri: lb://erp-auth
          predicates:
            - Path=/auth/**
        - id: erp-workflow
          uri: lb://erp-workflow
          predicates:
            - Path=/workflow/**
        - id: erp-system
          uri: lb://erp-system
          predicates:
            - Path=/system/**
        - id: erp-business
          uri: lb://erp-business
          predicates:
            - Path=/business/**

erp:
  internal:
    auth-signature-secret: ${ERP_INTERNAL_AUTH_SIGNATURE_SECRET:erp-internal-auth-signature-2026}
