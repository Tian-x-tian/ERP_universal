server:
  port: 9095
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: erp-ai
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        server-addr: ${spring.cloud.nacos.server-addr}
        file-extension: yml
        refresh-enabled: true
  config:
    import:
      - optional:nacos:erp-ai.yml?refreshable=true

erp:
  internal:
    auth-signature-secret: ${ERP_INTERNAL_AUTH_SIGNATURE_SECRET:erp-internal-auth-signature-2026}
  ai:
    enabled: ${ERP_AI_ENABLED:true}
    base-url: ${ERP_AI_BASE_URL:http://127.0.0.1:8317/v1}
    chat-path: ${ERP_AI_CHAT_PATH:/chat/completions}
    model: ${ERP_AI_MODEL:gpt-5.1}
    connect-timeout-ms: ${ERP_AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${ERP_AI_READ_TIMEOUT_MS:120000}
    max-history-turns: ${ERP_AI_MAX_HISTORY_TURNS:12}
    max-todo-items: ${ERP_AI_MAX_TODO_ITEMS:10}
    max-notice-items: ${ERP_AI_MAX_NOTICE_ITEMS:10}
