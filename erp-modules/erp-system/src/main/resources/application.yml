server:
  port: 9092
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    accesslog:
      enabled: ${ERP_ACCESS_LOG_ENABLED:false}

spring:
  application:
    name: erp-system
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        server-addr: ${spring.cloud.nacos.server-addr}
        file-extension: yml
        refresh-enabled: true
  config:
    import:
      - optional:nacos:erp-system.yml?refreshable=true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:erp_system}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:sql/init_system.sql

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.erp.system.domain.entity
  configuration:
    map-underline-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

erp:
  internal:
    auth-signature-secret: ${ERP_INTERNAL_AUTH_SIGNATURE_SECRET:erp-internal-auth-signature-2026}
  workflow:
    http-enabled: ${ERP_WORKFLOW_HTTP_ENABLED:false}
    scheduler-enabled: ${ERP_WORKFLOW_SCHEDULER_ENABLED:false}
  sql:
    upgrade:
      enabled: ${ERP_SQL_UPGRADE_ENABLED:true}
      location: classpath:sql/upgrade/system/*.sql

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-N/A}] %logger{50} - %msg%n"
  level:
    root: ${ERP_LOG_ROOT_LEVEL:INFO}
    com.erp.system: ${ERP_LOG_APP_LEVEL:DEBUG}
    com.erp.system.controller: ${ERP_LOG_CONTROLLER_LEVEL:DEBUG}
    com.erp.system.service: ${ERP_LOG_SERVICE_LEVEL:DEBUG}
    com.erp.system.mapper: ${ERP_LOG_MAPPER_LEVEL:DEBUG}
    org.mybatis: ${ERP_LOG_MYBATIS_LEVEL:DEBUG}
    com.baomidou.mybatisplus: ${ERP_LOG_MP_LEVEL:DEBUG}
    org.springframework.jdbc.core: ${ERP_LOG_JDBC_LEVEL:DEBUG}
    org.springframework.web: ${ERP_LOG_WEB_LEVEL:DEBUG}
    org.springframework.security: ${ERP_LOG_SECURITY_LEVEL:DEBUG}
    com.alibaba.nacos: ${ERP_LOG_NACOS_LEVEL:INFO}
