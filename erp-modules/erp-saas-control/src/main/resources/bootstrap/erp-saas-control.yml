server:
  port: 9096
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: erp-saas-control
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        register-enabled: ${NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        server-addr: ${spring.cloud.nacos.server-addr}
        file-extension: yml
        refresh-enabled: true
  config:
    import:
      - optional:nacos:erp-saas-control.yml?refreshable=true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:erp_saas_control}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:sql/init_control.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

erp:
  internal:
    auth-signature-secret: ${ERP_INTERNAL_AUTH_SIGNATURE_SECRET:}
  saas:
    sql:
      upgrade:
        enabled: ${ERP_SAAS_SQL_UPGRADE_ENABLED:true}
        location: classpath:sql/upgrade/control/*.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,ping
