spring:
  application:
    name: erp-workflow

erp:
  internal:
    auth-signature-secret: ${ERP_INTERNAL_AUTH_SIGNATURE_SECRET:dev-internal-auth-signature-secret-must-be-32bytes!}
    service-user-name: ${ERP_INTERNAL_SERVICE_USER_NAME:erp-workflow}
  workflow:
    http-enabled: true
    scheduler-enabled: true
  sql:
    upgrade:
      enabled: ${ERP_SQL_UPGRADE_ENABLED:true}
      location: classpath:sql/upgrade/workflow/*.sql
